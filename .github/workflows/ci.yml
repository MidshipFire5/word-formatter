name: Проверка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Тесты — ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Системные библиотеки для Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libdbus-1-3 \
            libfontconfig1

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Проверочные команды без графики
        run: |
          python main.py --version
          python main.py --list-profiles

      - name: Тесты
        run: python -m pytest

  first-run:
    name: Первый запуск через скрипт (Ubuntu)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Системные библиотеки для Qt (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libdbus-1-3 \
            libfontconfig1

      - name: Право на исполнение скрипта запуска
        run: chmod +x run_linux.sh

      - name: "Первый запуск: подготовка окружения"
        run: bash run_linux.sh --setup-only

      - name: Приложение работает из созданного окружения
        run: |
          .venv/bin/python main.py --version
          .venv/bin/python main.py --list-profiles

      - name: Повторный запуск не переустанавливает зависимости
        run: |
          start=$(date +%s)
          bash run_linux.sh --setup-only
          end=$(date +%s)
          echo "Повторная подготовка заняла $((end - start)) с"
          if [ $((end - start)) -gt 20 ]; then
            echo "::error::Повторный запуск занял слишком много времени: похоже, зависимости установились заново"
            exit 1
          fi
